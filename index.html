<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherif Helal</title>
  <link rel="stylesheet" href="/src/css/style.css">
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css"> -->
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-brand" onclick="navigateTo('home')">
      <img width="125px" src="./src/Imgs/logo.svg" alt="">
    </div>

    <!-- Auth Actions / Desktop & Mobile Menu Wrapper -->
    <div class="nav-actions" id="auth-buttons-desktop">
      <button id="theme-single-card" class="theme-single-card" onclick="toggleTheme()">
        <img width="15px" id="theme-card-icon" src="./src/Imgs/dark.svg" alt="">
        <span id="theme-card-text">الوضع المظلم</span>
      </button>
      <button class="btn btn-primary" onclick="openModal('login')">تسجيل الدخول</button>
    </div>

    <!-- Mobile Hamburger Toggle -->
    <button class="menu-toggle" id="menu-toggle-btn" onclick="toggleMobileMenu()">
      <span></span><span></span><span></span>
    </button>

    <!-- User Avatar & Dropdown -->
    <div class="user-avatar-container" id="user-avatar-wrapper" style="display: none;">
      <button class="avatar-btn" id="avatar-btn" onclick="toggleDropdown()">
        <span id="avatar-letter"></span>
        <div class="spinner" id="avatar-spinner" style="display: none;"></div>
        <svg class="svgDropdown" id="svgDropdown" width="18" height="9" viewBox="0 0 18 9" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.7895 7.41333L9.80446 1.47607C9.02366 0.812389 7.86755 0.846238 7.12692 1.55446L1 7.41333"
            stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

      <div class="user-dropdown" id="user-dropdown">
        <div class="dropdown-item">
          <div>
            <div id="dropdown-name" style="font-weight: bold;">--</div>
            <small id="dropdown-phone" style="color: var(--text-muted);">--</small>
          </div>
        </div>
        <div class="dropdown-item">
          <span>الرصيد:</span>
          <strong id="dropdown-balance">0 ج.م</strong>
        </div>

        <!-- ✅ تم تصحيح هذا العنصر -->
        <div class="dropdown-item" style="cursor: pointer;" onclick="window.open('https://wa.me/01029456680', '_blank')">
          <span>التواصل مع الدعم</span>
        </div>

        <div class="theme-cards">
          <div class="theme-card" id="theme-card-light" onclick="setTheme('light')">الوضع الفاتح</div>
          <div class="theme-card" id="theme-card-dark" onclick="setTheme('dark')">الوضع المظلم</div>
        </div>

        <div class="dropdown-item"
          style="cursor: pointer; color: #ef4444; font-weight: bold; justify-content: center; margin-top: 4px;"
          onclick="logout()">
          <span>تسجيل الخروج</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main id="app-root"></main>

  <!-- Footer -->
  <footer>
    <p>جميع الحقوق محفوظة ، منصة شريف هلال © 2026</p>
    <a href="https://mohamedabumansour.vercel.app/" class="dev-btn">تطوير ــــــ محمد منصور
      <svg width="15" height="15" viewBox="0 0 15 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.41406 11L1.41406 6L6.41406 1M1.41406 6H13.4141" stroke="" stroke-width="2" stroke-linecap="round" />
      </svg>
    </a>
  </footer>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal" onclick="handleModalOverlayClick(event)">
    <div class="modal-content">
      <button class="modal-close-btn" onclick="closeModal()" aria-label="إغلاق">&times;</button>

      <h3 id="modal-title">تسجيل الدخول</h3>

      <div class="form-group" id="group-name" style="display: none;">
        <label>الاسم بالكامل</label>
        <input type="text" id="input-name" placeholder="أدخل اسمك الثلاثي أو الرباعي" oninput="validateNameInput(this)">
        <span class="field-error" id="error-name"></span>
      </div>

      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="tel" id="input-phone" placeholder="01xxxxxxxxx" maxlength="11" oninput="validatePhoneInput(this)">
        <span class="field-error" id="error-phone"></span>
      </div>

      <div class="form-group" id="group-grade" style="display: none;">
        <label>الصف الدراسي</label>
        <input type="hidden" id="input-grade" value="">
        <div class="grade-selector-options">
          <button type="button" class="grade-opt-btn" onclick="selectGrade('sec1', this)">الأول الثانوي</button>
          <button type="button" class="grade-opt-btn" onclick="selectGrade('sec2', this)">الثاني الثانوي</button>
          <button type="button" class="grade-opt-btn" onclick="selectGrade('sec3', this)">الثالث الثانوي</button>
        </div>
        <span class="field-error" id="error-grade"></span>
      </div>

      <div class="form-group">
        <label>كلمة السر (6 أرقام)</label>
        <div class="pin-container" id="pin-container">
          <input type="text" inputmode="numeric" maxlength="1" class="pin-input" oninput="handlePinInput(this, 0)"
            onkeydown="handlePinKeydown(event, this, 0)">
          <input type="text" inputmode="numeric" maxlength="1" class="pin-input" oninput="handlePinInput(this, 1)"
            onkeydown="handlePinKeydown(event, this, 1)">
          <input type="text" inputmode="numeric" maxlength="1" class="pin-input" oninput="handlePinInput(this, 2)"
            onkeydown="handlePinKeydown(event, this, 2)">
          <input type="text" inputmode="numeric" maxlength="1" class="pin-input" oninput="handlePinInput(this, 3)"
            onkeydown="handlePinKeydown(event, this, 3)">
          <input type="text" inputmode="numeric" maxlength="1" class="pin-input" oninput="handlePinInput(this, 4)"
            onkeydown="handlePinKeydown(event, this, 4)">
          <input type="text" inputmode="numeric" maxlength="1" class="pin-input" oninput="handlePinInput(this, 5)"
            onkeydown="handlePinKeydown(event, this, 5)">
        </div>
        <span class="field-error" id="error-pin"></span>
      </div>

      <button class="btn-primary" onclick="handleAuthSubmit()">تأكيد</button>

      <div id="auth-switch-wrapper"
        style="text-align: center; margin-top: 14px; font-size: 0.88rem; color: var(--text-muted, #64748b);">
        <span id="auth-switch-text">ليس لديك حساب؟</span>
        <button type="button" id="auth-switch-btn" onclick="toggleAuthMode()"
          style="background: none; border: none; color: var(--primary-color, #000000); font-weight: bold; cursor: pointer; text-decoration: underline; font-family: inherit; margin-right: 4px; padding: 0;">
          قم بإنشاء حساب
        </button>
      </div>
    </div>
  </div>

  <!-- <script src="https://www.youtube.com/iframe_api"></script> -->
  <script src="./src/js/data.js"></script>
  <script src="./src/js/app.js"></script>
</body>

</html>
